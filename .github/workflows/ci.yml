name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: hustcer/setup-nu@v3
        with:
          version: 0.115.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
